server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # HTML nigdy nie jest cache'owany — inaczej użytkownik dostanie stare
  # nazwy plików assets po wdrożeniu.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Zasoby z hashem w nazwie: cache na rok, bez rewalidacji.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fonty: długi cache i CORS (preload z crossorigin tego wymaga).
  location ~* \.(?:woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
